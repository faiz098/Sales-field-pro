name: Build Sales Field Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SalesFieldProAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q SalesFieldProAndroid.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p SalesFieldProAndroid assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-field-pro-debug-apk
          path: SalesFieldProAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
